services:
  - type: web
    name: workforce-insights
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://workforce-insights.onrender.com
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: alex.rivera@northstar.example
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
